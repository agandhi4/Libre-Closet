name: Tag Release on Merge

on:
    pull_request:
        types: [closed]
        branches: [main]

jobs:
    tag:
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            # The branch name reaches the shell through env, never spliced into
            # the script (it is text the PR's author chose), and must be a version.
            - name: Extract version from branch name
              id: version
              env:
                  BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  VERSION="${BRANCH#release/}"
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::release branch '$BRANCH' does not name a version (release/X.Y.Z)"
                      exit 1
                  fi
                  echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

            - name: Create and push tag
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  git tag "$TAG"
                  git push origin "$TAG"

            # A tag pushed with GITHUB_TOKEN starts no workflow, so ci.yml is
            # dispatched on the tag explicitly: it builds, smoke-tests and
            # publishes the image, and runs the test jobs beside it.
            - name: Run CI and publish the tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  gh workflow run ci.yml --ref "$TAG"
