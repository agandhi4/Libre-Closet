name: CI

# PRs are gated on linux-box, not here (owner, 2026-09-28: GitHub Actions limits):
# ~/.claude/scripts/agent-worker/local_gate.sh runs the static, test and e2e jobs below
# against the PR head and posts their results under these same job names, which branch
# protection requires. On main this workflow only publishes the image; the test jobs
# stay here for a manual cloud run (workflow_dispatch).
#
# History: one workflow so publishing can wait for the tests. Until 2026-09-25 the
# image published from a separate workflow in parallel with CI: a red run
# still shipped :latest, and the homelab updater deploys :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only commits neither need tests nor a redeploy (a new image rolls
    # every client's static-asset cache key). Tag pushes ignore path filters.
    # docs.yml runs docs:check on exactly these paths; keep the two in step.
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. 0.2.2). Leave blank when triggered by a tag push."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Actions are pinned by commit; .github/dependabot.yml proposes updates.
jobs:
  # `npm run check` (the pre-commit hook) in two jobs, so the tests have the
  # runner to themselves instead of sharing it with type-aware ESLint and tsc
  # (#113). Their names are branch protection's required checks.
  static:
    name: format, lint, types
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:static

  test:
    name: unit + integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine # production (pgvault) runs 17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: Password123
          POSTGRES_DB: postgres-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d postgres-test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # The integration tier creates one scratch database per spec file here.
      TEST_DATABASE_URL: postgres://test:Password123@localhost:5432/postgres-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every core: vitest.config.ts gives the tests all of them under CI.
      - run: npm run test:all

  e2e:
    name: browser (production config)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: Password123
          POSTGRES_DB: postgres-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d postgres-test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: true
      DATABASE_HOST: localhost
      DATABASE_USER: test
      DATABASE_PASS: Password123
      DATABASE_SCHEMA: postgres-test
      # As production: the PWA on, so the service worker specs run instead of
      # skipping. Web Push needs an https: SITE_URL as its VAPID subject;
      # nothing is fetched from it.
      PWA_ENABLED: "true"
      SITE_URL: https://closet.test
      # Required, 32+ characters (src/config.ts). Signs only this job's
      # throwaway sessions.
      ACCESS_TOKEN_SECRET: ci-only-access-token-secret-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Throwaway VAPID keys
        run: |
          keys=$(npx web-push generate-vapid-keys --json)
          echo "PUBLIC_VAPID_KEY=$(echo "$keys" | jq -r .publicKey)" >> "$GITHUB_ENV"
          echo "PRIVATE_VAPID_KEY=$(echo "$keys" | jq -r .privateKey)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # SEED_SCREENSHOTS: test/screenshots.spec.ts seeds the personas into
      # this job's database and saves 390 px shots of the key pages.
      - run: npx playwright test --project=chromium
        env:
          SEED_SCREENSHOTS: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - id: screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots-390px
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link the screenshots
        if: always() && steps.screenshots.outputs.artifact-url != ''
        env:
          URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          {
            echo "### Phone screenshots (390 px, seed personas)"
            echo ""
            echo "[screenshots-390px]($URL): demo, sparse and fresh on the key pages."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish image
    # No `needs`: the tree was gated on its PR by the local gate (strict up-to-date
    # protection makes the squash commit's tree the gated head's tree). What the gate
    # never runs is the image itself: it is booted here before it is pushed (#181).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # The smoke test's empty database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: Password123
          POSTGRES_DB: postgres-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d postgres-test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GHCR_REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the homelab autoupdater polls: every main push and
          # every release moves it. sha-<7> is the rollback target.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-
      # Built once, into the runner's Docker with every tag, so the image the smoke
      # test boots is the image pushed: `docker push` sends those exact bytes, where a
      # second buildx run (even all cache hits) would export a new config and digest.
      # cache-to here, so a build the smoke test refuses still warms the next one.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          # Names the commit in the static-asset cache key (public/build.json).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # amd64 only: the sole deploy target is linux-box, and emulated arm64
          # builds of sharp would turn commit-to-deploy into a 30+ minute wait.
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boots it as production does (health, migrations, a page, SIGTERM); a failure
      # here publishes nothing. docs/deployment.md, CI and publishing.
      - name: Smoke-test the image
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          DATABASE_HOST: localhost
          DATABASE_USER: test
          DATABASE_PASS: Password123
          DATABASE_SCHEMA: postgres-test
        run: scripts/smoke-image.sh "$IMAGE_ID"
      - name: Push
        run: docker push --all-tags "$GHCR_REGISTRY/$IMAGE_NAME"
